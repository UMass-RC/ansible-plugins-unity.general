# intentionally malformed files
# pre-commit automatically excludes submodules
exclude: |
  (?x)^(
      .*\.dist|
  )$
repos:
  # auto formatters (no work required) #############################################################
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: .*\.patch$
      - id: end-of-file-fixer
        exclude: .*\.patch$
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        additional_dependencies: ["prettier@3.9.10"]
        entry: prettier --write --ignore-unknown
        types: [yaml]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # linters (work required) ########################################################################
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: "^tests/.*"
      - id: check-json
        exclude: .vscode/settings.json
      - id: check-xml
      - id: check-added-large-files
      - id: check-executables-have-shebangs
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # - repo: https://github.com/ansible/ansible-lint.git
  #   rev: v24.10.0
  #   hooks:
  #     - id: ansible-lint
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.89
    hooks:
      - id: ty

  - repo: local
    hooks:
      - id: mode-must-be-quoted
        name: mode must be in quotes
        language: system
        entry: sed
        args: [-i, -E, 's/mode: ([0-9]+)$/mode: "\1"/']
        types: [yaml]
