[project]
name = "general"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ansible-core<2.20",
    "clustershell>=1.9.3",
    "jc>=1.25.7",
    "pexpect>=4.9.0",
    "prek>=0.5.6",
    "requests>=2.34.2",
    "slack-sdk>=3.46.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["UP031", "FLY002", "TRY002", "PYI042", "C408"]

